career-profile: 
    title: Summary
    text: "[Jenn Edge](https://linkedin.com/in/engineer-edge) is a senior engineering leader with 20 years of experience building and leading software engineering teams and organizations. With over a decade of dedicated leadership, she is committed to driving [continuous improvement](https://www.infotechinc.com/blog/dont-stop-believing-the-journey-of-agile-self-improvement) within her teams. Jenn leverages systems thinking and engineering best practices to optimize team processes. Her strength lies in fostering effective cross-functional collaboration, building inclusive teams, and empowering the personal and professional growth of engineers and leaders alike.
<br/>
<br/>
Jenn currently leads the Claims Financials engineering organization at [GEICO](https://geico.com/careers), supporting the reliable disbursement of more than $30 billion in annual payments. Her work spans engineering modernization, cloud migration, operational resilience, and security. She has championed automation that reduced recurring engineering workload by 85%, strengthened site reliability practices, and introduced AI-assisted development to improve engineering efficiency. She is also helping bring AI-powered customer experiences to life, including a Sierra AI skill for answering payment-related questions. Along the way, she expanded the engineering organization from 7 to 15 engineers across two teams, building clear ownership and a high-trust culture grounded in psychological safety and professional development.
<br/>
<br/>
She previously managed the [SyncSketch](https://syncsketch.com/) engineering team at [Unity Technologies](https://unity3d.com/), and directed the AASHTOWare engineering team at [Infotech](https://www.infotechinc.com/). She successfully scaled teams from startup to enterprise software standards, navigating technical modernization and requirements for security, data protection, and accessibility.
<br/>
<br/>
Jenn's leadership philosophy blends technical depth with human-centered coaching. She partners with product and business teams to establish clarity, improve delivery, and align engineering priorities with business outcomes. She believes sustainable engineering excellence comes from empowering people, developing future leaders, and creating environments where teams can thrive.
<br/>
<br/>
Jenn is a member of the [.NET Foundation](https://www.dotnetfoundation.org/) and contributed open-source code to [improve the performance](https://goo.gl/EibZwc) of Entity Framework 6.2.
"
publications:
    title: Speaking & Community
    intro: "<br/>Jenn has spoken at local meetups to international conferences, including the 2020 Virtual Grace Hopper Celebration with 39,000+ global attendees. Jenn has also been involved in community outreach including mentoring other leaders, recruiting, and speaking at conferences.
<br/>
<br/>
In 2019, Jenn co-founded [We Advance Tech Together (WATT)](https://twitter.com/watt_zone), a 501(c)(3) nonprofit supporting women in technology through community-building and mentoring. She previously served as Vice President on the board, helping to grow the organization to more than 100 members through social media outreach and in-person events."
    
