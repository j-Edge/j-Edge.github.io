#Update sections by editing the data.yml file inside _data folder.

baseurl: ''

# Style will be applied only after restarting the build or serve.
theme_skin: berry # ceramic blue turquoise berry

# Tracker
analytics: G-P6KZ8VVN8J

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Build settings
encoding: "utf-8"
compress_html: # - http://jch.penibelst.de/
  clippings: all
  ignore:
    envs: development
safe: false

# Development Settings
port: 4000